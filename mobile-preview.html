<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мобильная вёрстка — Сантерра</title>
<style>
  body { margin: 0; background: #0b0b12; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  .wrap { display: flex; gap: 20px; padding: 20px; align-items: flex-start; flex-wrap: wrap; }
  .dev h2 { margin: 0 0 8px; font-size: 15px; color: #a78bfa; }
  iframe { height: 720px; border: 1px solid #333; border-radius: 12px; background: #000; display: block; }
  .dev--320 iframe { width: 320px; }
  .dev--360 iframe { width: 360px; }
  .dev--400 iframe { width: 400px; }
  #report { padding: 0 20px 24px; white-space: pre-wrap; font: 13px/1.5 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <div class="dev dev--320"><h2>320 px</h2><iframe title="320"></iframe></div>
  <div class="dev dev--360"><h2>360 px</h2><iframe title="360"></iframe></div>
  <div class="dev dev--400"><h2>400 px</h2><iframe title="400"></iframe></div>
</div>
<pre id="report">собираю отчёт…</pre>
<script>
(function () {
  var frames = Array.prototype.slice.call(document.querySelectorAll('iframe'));
  var lines = [];
  var done = 0;

  function check(frame) {
    var w = frame.getAttribute('title');
    var d = frame.contentDocument;
    var win = frame.contentWindow;
    var doc = d.documentElement;

    var overflow = doc.scrollWidth - doc.clientWidth;

    var wide = [];
    Array.prototype.forEach.call(d.querySelectorAll('body *'), function (el) {
      var r = el.getBoundingClientRect();
      if (r.width > 0 && (r.right > doc.clientWidth + 1 || r.left < -1)) {
        var cs = win.getComputedStyle(el);
        if (cs.position === 'fixed' && cs.visibility === 'hidden') return;
        if (el.closest('.backdrop')) return;      /* декоративный фон */
        if (el.closest('.hero__visual')) return;  /* декоративное фото героя */
        if (el.closest('.cta__glow')) return;     /* декоративное свечение */
        if (el.closest('.promo__glow')) return;   /* декоративное свечение */
        if (el.closest('.ticker')) return;        /* бегущая строка */
        if (el.closest('.scroll-progress')) return;
        wide.push(el.tagName.toLowerCase() +
          (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).join('.') : '') +
          ' [' + Math.round(r.left) + '→' + Math.round(r.right) + ']');
      }
    });

    var broken = Array.prototype.filter.call(d.images, function (i) {
      return i.getAttribute('src') && i.complete && i.naturalWidth === 0;
    });
    var pending = Array.prototype.filter.call(d.images, function (i) {
      return i.getAttribute('src') && !i.complete;
    });

    lines.push('=== ' + w + 'px ===');
    lines.push('scrollWidth=' + doc.scrollWidth + '  clientWidth=' + doc.clientWidth + '  overflowX=' + overflow);
    lines.push('высота страницы: ' + doc.scrollHeight + ' px');
    lines.push('картинок всего: ' + d.images.length + ', не загружено: ' + pending.length + ', битых: ' + broken.length +
      (broken.length ? ' → ' + Array.prototype.map.call(broken, function (i) { return i.getAttribute('src'); }).join(', ') : ''));
    lines.push('элементов шире экрана (без декора): ' + wide.length);
    wide.slice(0, 12).forEach(function (x) { lines.push('   • ' + x); });
    lines.push('');
  }

  function scrollThrough(frame, cb) {
    var win = frame.contentWindow;
    var doc = frame.contentDocument;
    doc.documentElement.style.scrollBehavior = 'auto';
    var step = 400;
    var y = 0;
    var max = doc.documentElement.scrollHeight;

    function tick() {
      y += step;
      win.scrollTo(0, y);
      if (y < max) {
        setTimeout(tick, 40);
      } else {
        setTimeout(function () {
          win.scrollTo(0, 0);
          setTimeout(cb, 400);
        }, 500);
      }
    }
    tick();
  }

  frames.forEach(function (f) {
    function start() {
      scrollThrough(f, function () {
        check(f);
        done++;
        if (done === frames.length) {
          lines.push('Проверка завершена.');
          document.getElementById('report').textContent = lines.join('\n');
          window.__report = lines.join('\n');
        }
      });
    }
    f.addEventListener('load', start);
    f.src = 'index.html';
  });
})();
</script>
</body>
</html>
